name: flutter_local_timezone

description: "A new Flutter package project."

version: 0.1.0

repository: https://github.com/BirjuVachhani/local_timezone
homepage: https://github.com/BirjuVachhani/local_timezone

resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  local_timezone: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # For integration_test/, which is analysed as part of this package even
  # though test_host is what installs and runs it.
  integration_test:
    sdk: flutter
  timezone: ^0.11.1
  flutter_lints: ^6.0.0

flutter:
  # Only the platforms with a native change notification appear here. The
  # package is usable on every platform `local_timezone` supports whether or
  # not it is listed: resolution is pure Dart and needs nothing from this
  # section, and `LocalTimezoneWatcher` falls back to its app-lifecycle leg
  # where there is no native implementation.
  #
  # `dartPluginClass` is deliberately absent. It exists to let the tooling call
  # a static `registerWith` during startup, which is how a platform
  # implementation injects itself into a separate app-facing package. Nothing
  # here needs that: the listener API and the channel that feeds it live in the
  # same package, so the Dart side opens the `EventChannel` itself.
  plugin:
    platforms:
      android:
        package: com.birjuvachhani.flutter_local_timezone
        pluginClass: FlutterLocalTimezonePlugin
      # `sharedDarwinSource` puts both Apple platforms on one source tree under
      # `darwin/` instead of near-identical copies under `ios/` and `macos/`.
      # They observe the same notification through the same framework API; the
      # only real difference is that iOS spells the registrar's messenger as a
      # method and macOS as a property.
      ios:
        pluginClass: FlutterLocalTimezonePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterLocalTimezonePlugin
        sharedDarwinSource: true
      linux:
        pluginClass: FlutterLocalTimezonePlugin
      windows:
        pluginClass: FlutterLocalTimezonePluginCApi
