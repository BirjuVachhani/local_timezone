name: local_timezone
description: >-
  Synchronously read the device's IANA timezone identifier, such as
  Asia/Kolkata, in pure Dart. Works on Android, iOS, macOS, Windows, Linux and
  the web, with no plugin and no dependencies.
version: 0.1.0

repository: https://github.com/BirjuVachhani/local_timezone
homepage: https://github.com/BirjuVachhani/local_timezone
issue_tracker: https://github.com/BirjuVachhani/local_timezone/issues

topics:
  - timezone
  - datetime
  - intl
  - ffi

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  meta: ">=1.18.0 <2.0.0"
  web: ">=1.1.0 <2.0.0"

dev_dependencies:
  timezone: ^0.11.1
  lints: ^6.1.0
  test: ^1.31.0
