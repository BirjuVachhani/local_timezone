name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. `pubspec.lock` is deliberately not committed, so every run
    # resolves fresh. This is what catches a `timezone` or `test` release that
    # breaks the suite with nobody having pushed anything.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting and analysis for the whole workspace. Needs Flutter, because
  # `flutter_local_timezone` is a workspace member and `dart pub get` refuses to
  # resolve a workspace that contains a Flutter package.
  analyze:
    name: format + analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

  # The real matrix: every OS and CPU architecture the package claims, crossed
  # with a handful of system timezones.
  #
  # The timezone axis is the point of the job rather than a bonus. GitHub
  # runners are all UTC, and under UTC the Windows and Linux providers barely
  # do any work: no CLDR key gets mapped, no `backward` alias gets rewritten,
  # and a provider that always answered "UTC" would pass. Setting the system
  # zone is the only way to reach `GetDynamicTimeZoneInformation` and
  # `/etc/localtime` with something interesting in them.
  test:
    name: ${{ matrix.target.label }} · ${{ matrix.zone.iana }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: ubuntu-24.04, arch: x64, label: linux-x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, label: linux-arm64 }
          - { runner: macos-15-intel, arch: x64, label: macos-x64 }
          - { runner: macos-15, arch: arm64, label: macos-arm64 }
          - { runner: windows-2025, arch: x64, label: windows-x64 }
          - { runner: windows-11-arm, arch: arm64, label: windows-arm64 }
        zone:
          # `Etc/UTC` rather than `UTC`, deliberately. `UTC` is a `backward`
          # alias, so canonicalization rewrites it to `Etc/UTC` and the macOS
          # symlink assertion would then compare a canonical name against a raw
          # one. `Etc/UTC` is already primary, so every layer agrees.
          - { iana: Etc/UTC, windows: UTC }
          # A half-hour offset with no DST, and the sharpest CLDR case there
          # is: the Windows key maps to the *deprecated* `Asia/Calcutta`, so
          # this cell is the one that proves canonicalization runs on Windows.
          - { iana: Asia/Kolkata, windows: India Standard Time }
          # A negative offset that observes DST.
          - { iana: America/Denver, windows: Mountain Standard Time }
    steps:
      - uses: actions/checkout@v7

      # `local_timezone` has no Flutter dependency, but it shares a pub
      # workspace with a package that does, and `dart pub get` fails on the
      # whole workspace because of it. Flutter ships x64 archives only for
      # Linux and Windows, so installing it here would cost the arm64 half of
      # this matrix. Dart itself has first class arm64 builds on all three
      # operating systems, so the workspace member goes and Flutter stays out.
      # This is an ephemeral checkout; nothing is being deleted that matters.
      - name: Take the Flutter packages out of the workspace
        run: |
          rm -rf packages/flutter_local_timezone

          # `test_host` is nested inside what was just deleted, but it is also
          # listed on its own in the root workspace, and pub rejects a member
          # path that is not there: "No workspace packages matching
          # packages/flutter_local_timezone/test_host". So the entry has to go
          # with the directory. grep rather than `sed -i`, whose spelling
          # differs across the GNU, BSD and Git Bash seds this runs on.
          grep -v 'packages/flutter_local_timezone/test_host' pubspec.yaml > pubspec.tmp
          mv pubspec.tmp pubspec.yaml

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          # Explicit rather than inferred, so a runner image that quietly
          # changed architecture fails here instead of testing the wrong one.
          architecture: ${{ matrix.target.arch }}

      - name: Confirm the SDK is native
        run: dart --version

      - name: Set the system timezone (Linux)
        if: runner.os == 'Linux'
        env:
          ZONE: ${{ matrix.zone.iana }}
        run: |
          sudo timedatectl set-timezone "$ZONE"
          actual=$(timedatectl show --property=Timezone --value)
          if [ "$actual" != "$ZONE" ]; then
            echo "::error::wanted $ZONE, timedatectl reports $actual"
            exit 1
          fi

      - name: Set the system timezone (macOS)
        if: runner.os == 'macOS'
        env:
          ZONE: ${{ matrix.zone.iana }}
        run: |
          # Not `systemsetup -settimezone`. It validates the argument against
          # `-listtimezones`, and that needs the Full Disk Access a CI shell
          # does not have, so on a runner it rejects every zone there is:
          # "Asia/Kolkata is not a valid timezone". The symlink is what
          # Foundation reads anyway, so write it directly.
          if [ ! -f "/usr/share/zoneinfo/$ZONE" ]; then
            echo "::error::no zone file for $ZONE in this tzdata"
            exit 1
          fi
          sudo ln -sfh "/usr/share/zoneinfo/$ZONE" /etc/localtime

          # Independent check, because writing the symlink and then reading it
          # back would prove nothing. libc going through /etc/localtime has to
          # agree with libc going through TZ. Both are evaluated for now, so
          # this stays correct either side of a DST boundary.
          from_symlink=$(date +%z)
          from_tz=$(TZ="$ZONE" date +%z)
          if [ "$from_symlink" != "$from_tz" ]; then
            echo "::error::wanted $ZONE ($from_tz), /etc/localtime gives $from_symlink"
            exit 1
          fi

      - name: Set the system timezone (Windows)
        if: runner.os == 'Windows'
        # pwsh, not bash: Git Bash rewrites the `/s` flag into a path.
        shell: pwsh
        env:
          WINDOWS_ZONE: ${{ matrix.zone.windows }}
        run: |
          tzutil /s "$env:WINDOWS_ZONE"
          $actual = (tzutil /g).Trim()
          if ($actual -ne $env:WINDOWS_ZONE) {
            Write-Output "::error::wanted $env:WINDOWS_ZONE, tzutil reports $actual"
            exit 1
          }

      - run: dart pub get

      - name: dart test
        working-directory: packages/local_timezone
        run: dart test

  # The web providers, on both compilers and both runtimes. No architecture
  # axis: the package compiles to JavaScript or to Wasm here, so the host CPU
  # is not part of what is under test.
  #
  # `TZ` is enough on this job, unlike the native one. Chrome and Node both
  # honour it, and no web test compares against `/etc/localtime`, so there is
  # nothing to desynchronise.
  web:
    name: web · ${{ matrix.zone }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: ${{ matrix.zone }}
    strategy:
      fail-fast: false
      matrix:
        zone: [Etc/UTC, Asia/Kolkata, America/Denver]
    steps:
      - uses: actions/checkout@v7

      - name: Take the Flutter packages out of the workspace
        run: |
          rm -rf packages/flutter_local_timezone

          # `test_host` is nested inside what was just deleted, but it is also
          # listed on its own in the root workspace, and pub rejects a member
          # path that is not there: "No workspace packages matching
          # packages/flutter_local_timezone/test_host". So the entry has to go
          # with the directory. grep rather than `sed -i`, whose spelling
          # differs across the GNU, BSD and Git Bash seds this runs on.
          grep -v 'packages/flutter_local_timezone/test_host' pubspec.yaml > pubspec.tmp
          mv pubspec.tmp pubspec.yaml

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: dart test (Chrome, dart2js and dart2wasm)
        working-directory: packages/local_timezone
        run: dart test -p chrome -c dart2js -c dart2wasm

      - name: dart test (Node)
        working-directory: packages/local_timezone
        run: dart test -p node

  # Android, on a real emulator, which is the only place `android.dart` runs at
  # all. It reads `__system_property_get`, which is bionic, so no desktop host
  # reaches a line of it and the `test` job above cannot cover this provider
  # even in principle.
  #
  # The tests live in `packages/flutter_local_timezone/integration_test`.
  # `test_host` is the app they are installed into and owns nothing else; see
  # its README.
  android:
    name: android · ${{ matrix.zone }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        zone: [Etc/UTC, Asia/Kolkata, America/Denver]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # The runner image ships KVM but leaves the device root-only. Without
      # this the emulator falls back to software rendering, and the boot alone
      # then eats most of the job timeout.
      - name: Give the runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: flutter test (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ZONE: ${{ matrix.zone }}
        with:
          api-level: 35
          # `google_apis`, not `google_apis_playstore`. Only the userdebug
          # image lets `adb root` through, and without root the property below
          # cannot be written at all: a Play Store image answers `adbd cannot
          # run as root in production builds` and then `Failed to set property
          # 'persist.sys.timezone'`.
          target: google_apis
          arch: x86_64
          working-directory: packages/flutter_local_timezone/test_host
          script: |
            adb root
            adb wait-for-device

            # Otherwise the framework is free to resync the zone from the
            # network partway through and undo the line below.
            adb shell settings put global auto_time_zone 0

            # The provider reads exactly this property, and so does bionic when
            # `TZ` is unset, so writing it moves the provider and `DateTime`
            # together. That is what keeps the round trip assertion meaningful
            # here instead of tautological. Contrast Windows, where `TZ` moves
            # only one of the two.
            adb shell setprop persist.sys.timezone "$ZONE"
            actual=$(adb shell getprop persist.sys.timezone | tr -d '\r')
            if [ "$actual" != "$ZONE" ]; then
              echo "::error::wanted $ZONE, the device reports '$actual'"
              exit 1
            fi

            # Read rather than assumed to be emulator-5554, so a second
            # emulator or a shifted port surfaces as a wrong-device run instead
            # of a missing-device error.
            serial=$(adb devices | awk '/emulator/ {print $1; exit}')

            # `EXPECTED_RAW` is the same string as `EXPECTED_ZONE` because the
            # Android provider returns the property verbatim as `raw`, and the
            # property is what was just written. Both are already primary IANA
            # names, so canonicalization is a no-op on all three.
            flutter test ../integration_test -d "$serial" \
              --dart-define=EXPECTED_ZONE="$ZONE" \
              --dart-define=EXPECTED_RAW="$ZONE"

  # iOS, on a simulator. Narrower than the Android job on purpose: the macOS
  # cells in `test` already exercise `apple.dart` across three zones, so what
  # this adds is the one thing they cannot show, that
  # `DynamicLibrary.process()` resolves Foundation from inside an iOS app.
  # iOS refuses to dlopen a Mach-O that is not embedded in the bundle, so
  # "works on macOS" is not evidence that it works here.
  ios:
    name: ios simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # Opportunistic, and deliberately not depended on. A simulator takes its
      # zone from the host, so moving the host before booting one is the only
      # lever there is, and if it lands this job runs against a half-hour
      # offset whose IANA name is alias-prone rather than against plain UTC.
      # If it does not land, nothing below cares. Same command as the macOS
      # cells above, for the same reason.
      - name: Nudge the host timezone before anything boots
        env:
          ZONE: Asia/Kolkata
        run: |
          sudo ln -sfh "/usr/share/zoneinfo/$ZONE" /etc/localtime
          date

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r 'first(
            .devices | to_entries[] | select(.key | test("iOS")) | .value[]
            | select(.name | startswith("iPhone")) | .udid
          )')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::no iPhone simulator on this runner image"
            exit 1
          fi

          # `bootstatus -b` boots and then waits. Its exit code is not
          # dependable (a booted device still reports Status=4294967295), so
          # the state is what gets checked.
          xcrun simctl bootstatus "$udid" -b || true
          state=$(xcrun simctl list devices -j \
            | jq -r --arg u "$udid" 'first(.devices[][] | select(.udid == $u) | .state)')
          if [ "$state" != "Booted" ]; then
            echo "::error::simulator $udid did not boot (state=$state)"
            exit 1
          fi
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      # No `EXPECTED_ZONE`, unlike Android. Nothing puts a simulator into a
      # chosen zone: `simctl` has no timezone command, and both
      # `SIMCTL_CHILD_TZ` and `launchctl setenv TZ` inside the device were
      # tried and neither reaches Foundation. Asserting a zone here would
      # therefore be asserting that the nudge above worked, which is not
      # something this package controls.
      #
      # The round trip case carries the job instead, and it needs nothing
      # injected: whatever zone the simulator reports has to agree with the
      # simulator's own clock, so a well formed but wrong identifier still
      # fails. The zone that was actually resolved is printed by the first
      # test, so the log says which one ran.
      - name: flutter test (iOS simulator)
        working-directory: packages/flutter_local_timezone/test_host
        run: flutter test ../integration_test -d "$SIM_UDID"

  # `environment: sdk: ^3.12.0` in the pubspec is a promise to callers. Without
  # this job the promise is only ever checked against whatever `stable`
  # happens to be.
  min-sdk:
    name: minimum supported SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Take the Flutter packages out of the workspace
        run: |
          rm -rf packages/flutter_local_timezone

          # `test_host` is nested inside what was just deleted, but it is also
          # listed on its own in the root workspace, and pub rejects a member
          # path that is not there: "No workspace packages matching
          # packages/flutter_local_timezone/test_host". So the entry has to go
          # with the directory. grep rather than `sed -i`, whose spelling
          # differs across the GNU, BSD and Git Bash seds this runs on.
          grep -v 'packages/flutter_local_timezone/test_host' pubspec.yaml > pubspec.tmp
          mv pubspec.tmp pubspec.yaml

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - run: dart pub get

      - name: dart test
        working-directory: packages/local_timezone
        run: dart test
