name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. `pubspec.lock` is deliberately not committed, so every run
    # resolves fresh. This is what catches a `timezone` or `test` release that
    # breaks the suite with nobody having pushed anything.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Formatting and analysis for the whole workspace. Needs Flutter, because
  # `flutter_local_timezone` is a workspace member and `dart pub get` refuses to
  # resolve a workspace that contains a Flutter package.
  analyze:
    name: format + analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

  # The real matrix: every OS and CPU architecture the package claims, crossed
  # with a handful of system timezones.
  #
  # The timezone axis is the point of the job rather than a bonus. GitHub
  # runners are all UTC, and under UTC the Windows and Linux providers barely
  # do any work: no CLDR key gets mapped, no `backward` alias gets rewritten,
  # and a provider that always answered "UTC" would pass. Setting the system
  # zone is the only way to reach `GetDynamicTimeZoneInformation` and
  # `/etc/localtime` with something interesting in them.
  test:
    name: ${{ matrix.target.label }} · ${{ matrix.zone.iana }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: ubuntu-24.04, arch: x64, label: linux-x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, label: linux-arm64 }
          - { runner: macos-15-intel, arch: x64, label: macos-x64 }
          - { runner: macos-15, arch: arm64, label: macos-arm64 }
          - { runner: windows-2025, arch: x64, label: windows-x64 }
          - { runner: windows-11-arm, arch: arm64, label: windows-arm64 }
        zone:
          # `Etc/UTC` rather than `UTC`, deliberately. `UTC` is a `backward`
          # alias, so canonicalization rewrites it to `Etc/UTC` and the macOS
          # symlink assertion would then compare a canonical name against a raw
          # one. `Etc/UTC` is already primary, so every layer agrees.
          - { iana: Etc/UTC, windows: UTC }
          # A half-hour offset with no DST, and the sharpest CLDR case there
          # is: the Windows key maps to the *deprecated* `Asia/Calcutta`, so
          # this cell is the one that proves canonicalization runs on Windows.
          - { iana: Asia/Kolkata, windows: India Standard Time }
          # A negative offset that observes DST.
          - { iana: America/Denver, windows: Mountain Standard Time }
    steps:
      - uses: actions/checkout@v7

      # `local_timezone` has no Flutter dependency, but it shares a pub
      # workspace with a package that does, and `dart pub get` fails on the
      # whole workspace because of it. Flutter ships x64 archives only for
      # Linux and Windows, so installing it here would cost the arm64 half of
      # this matrix. Dart itself has first class arm64 builds on all three
      # operating systems, so the workspace member goes and Flutter stays out.
      # This is an ephemeral checkout; nothing is being deleted that matters.
      - name: Take the Flutter packages out of the workspace
        run: |
          rm -rf packages/flutter_local_timezone

          # `test_host` is nested inside what was just deleted, but it is also
          # listed on its own in the root workspace, and pub rejects a member
          # path that is not there: "No workspace packages matching
          # packages/flutter_local_timezone/test_host". So the entry has to go
          # with the directory. grep rather than `sed -i`, whose spelling
          # differs across the GNU, BSD and Git Bash seds this runs on.
          grep -v 'packages/flutter_local_timezone/test_host' pubspec.yaml > pubspec.tmp
          mv pubspec.tmp pubspec.yaml

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          # Explicit rather than inferred, so a runner image that quietly
          # changed architecture fails here instead of testing the wrong one.
          architecture: ${{ matrix.target.arch }}

      - name: Confirm the SDK is native
        run: dart --version

      - name: Set the system timezone (Linux)
        if: runner.os == 'Linux'
        env:
          ZONE: ${{ matrix.zone.iana }}
        run: |
          sudo timedatectl set-timezone "$ZONE"
          actual=$(timedatectl show --property=Timezone --value)
          if [ "$actual" != "$ZONE" ]; then
            echo "::error::wanted $ZONE, timedatectl reports $actual"
            exit 1
          fi

      - name: Set the system timezone (macOS)
        if: runner.os == 'macOS'
        env:
          ZONE: ${{ matrix.zone.iana }}
        run: |
          # Not `systemsetup -settimezone`. It validates the argument against
          # `-listtimezones`, and that needs the Full Disk Access a CI shell
          # does not have, so on a runner it rejects every zone there is:
          # "Asia/Kolkata is not a valid timezone". The symlink is what
          # Foundation reads anyway, so write it directly. Its target has to
          # use Foundation's zoneinfo root, not /usr/share/zoneinfo, which is
          # itself a symlink. Foundation recovers the name by stripping this
          # prefix from the raw /etc/localtime target and otherwise falls back
          # to GMT even though libc can read the same tzfile.
          zoneinfo=/var/db/timezone/zoneinfo
          if [ ! -f "$zoneinfo/$ZONE" ]; then
            echo "::error::no zone file for $ZONE in this tzdata"
            exit 1
          fi
          sudo ln -sfh "$zoneinfo/$ZONE" /etc/localtime

          # Ask the same Foundation API family as the Apple provider. `date`
          # only proves libc can read the tzfile and misses a failure to recover
          # its IANA name, which is the behavior this matrix needs to exercise.
          actual=$(swift -e 'import Foundation; print(NSTimeZone.local.identifier)')
          if [ "$actual" != "$ZONE" ]; then
            echo "::error::wanted $ZONE, Foundation reports $actual"
            exit 1
          fi

      - name: Set the system timezone (Windows)
        if: runner.os == 'Windows'
        # pwsh, not bash: Git Bash rewrites the `/s` flag into a path.
        shell: pwsh
        env:
          WINDOWS_ZONE: ${{ matrix.zone.windows }}
        run: |
          tzutil /s "$env:WINDOWS_ZONE"
          $actual = (tzutil /g).Trim()
          if ($actual -ne $env:WINDOWS_ZONE) {
            Write-Output "::error::wanted $env:WINDOWS_ZONE, tzutil reports $actual"
            exit 1
          }

      - run: dart pub get

      - name: dart test
        working-directory: packages/local_timezone
        run: dart test

  # The web providers, on both compilers and both runtimes. No architecture
  # axis: the package compiles to JavaScript or to Wasm here, so the host CPU
  # is not part of what is under test.
  #
  # `TZ` is enough on this job, unlike the native one. Chrome and Node both
  # honour it, and no web test compares against `/etc/localtime`, so there is
  # nothing to desynchronise.
  web:
    name: web · ${{ matrix.zone }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: ${{ matrix.zone }}
    strategy:
      fail-fast: false
      matrix:
        zone: [Etc/UTC, Asia/Kolkata, America/Denver]
    steps:
      - uses: actions/checkout@v7

      - name: Take the Flutter packages out of the workspace
        run: |
          rm -rf packages/flutter_local_timezone

          # `test_host` is nested inside what was just deleted, but it is also
          # listed on its own in the root workspace, and pub rejects a member
          # path that is not there: "No workspace packages matching
          # packages/flutter_local_timezone/test_host". So the entry has to go
          # with the directory. grep rather than `sed -i`, whose spelling
          # differs across the GNU, BSD and Git Bash seds this runs on.
          grep -v 'packages/flutter_local_timezone/test_host' pubspec.yaml > pubspec.tmp
          mv pubspec.tmp pubspec.yaml

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      - name: dart test (Chrome, dart2js and dart2wasm)
        working-directory: packages/local_timezone
        run: dart test -p chrome -c dart2js -c dart2wasm

      - name: dart test (Node)
        working-directory: packages/local_timezone
        run: dart test -p node

  # Android, on a real emulator, which is the only place `android.dart` runs at
  # all. It reads `__system_property_get`, which is bionic, so no desktop host
  # reaches a line of it and the `test` job above cannot cover this provider
  # even in principle.
  #
  # The tests live in `packages/flutter_local_timezone/integration_test`.
  # `test_host` is the app they are installed into and owns nothing else; see
  # its README.
  android:
    name: android · ${{ matrix.zone }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        zone: [Etc/UTC, Asia/Kolkata, America/Denver]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # The runner image ships KVM but leaves the device root-only. Without
      # this the emulator falls back to software rendering, and the boot alone
      # then eats most of the job timeout.
      - name: Give the runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: flutter test (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ZONE: ${{ matrix.zone }}
          # Where the harness moves the device to once the app is running, so
          # the listener has a real ACTION_TIMEZONE_CHANGED to hear. One
          # constant for every cell, because it only has to differ from each
          # `zone` in the matrix above, and this differs from all three.
          ZONE_AFTER: Australia/Sydney
        with:
          api-level: 35
          # Keep the `google_apis` userdebug image, not the Play Store user
          # image. A Play Store image refuses both `adb root` and a direct
          # `setprop persist.sys.timezone`. The harness no longer needs either,
          # but retaining the debuggable image preserves the direct property
          # write as a diagnostic fallback if the system-service path fails.
          target: google_apis
          arch: x86_64
          # The action's own defaults, reproduced because this input replaces
          # them rather than adding to them, plus the one that fixes a race.
          #
          # An emulator reports the host's zone to the guest as a NITZ
          # telephony signal, and Android's time zone detector applies it like
          # any other suggestion. A GitHub runner is UTC, so every cell here
          # boots into Etc/UTC by that route and the script below then has to
          # take it away again. Those two writes land within seconds of each
          # other, and on 2026-08-08 one cell lost: the guard read
          # America/Denver, the app read Etc/UTC seven minutes later, and the
          # failure was indistinguishable from the provider being wrong.
          # Pointing the signal at the zone the cell wants means the detector
          # and the script agree on the answer, so it no longer matters which
          # of them writes last.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -timezone ${{ matrix.zone }}
          working-directory: packages/flutter_local_timezone/test_host
          # This action intentionally parses every noncomment physical line in
          # `script` and runs each one in a separate `sh -c`. Keep this input to
          # one command. Variables, conditionals, and continued Flutter
          # arguments must live in the invoked script so they share one shell.
          #
          # The script asks Android's alarm service to set the zone. That
          # service writes `persist.sys.timezone` with system privilege, so
          # there is no `adb root` restart to race the emulator's post-boot adb
          # commands. Do not replace it with `adb root` plus `setprop`.
          script: sh ../../../.github/scripts/android_device_test.sh

  # macOS, as a real Flutter app rather than a Dart process. This is the only
  # job that can prove the Apple half of the change listener, because it is the
  # only place the system timezone can actually be moved: `systemsetup` needs
  # root, and no App Store safe API can move it from inside a process at all.
  #
  # The `test` job's macOS cells cover reading the zone and do not overlap with
  # this. They relink `/etc/localtime`, which moves the value Foundation reads
  # but posts no notification, so they could not exercise a listener even if
  # they wanted to. See the script for why that distinction matters.
  #
  # iOS is deliberately not given the same treatment. A simulator takes its zone
  # from the host, and whether it re-reads on a host change or only at boot is
  # not documented, so the mid-run move is not known to be observable there.
  # Until someone establishes that, the iOS job below stays a read-only check
  # and the listener case skips on it.
  macos_app:
    name: macos app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Where the machine starts, and where the harness moves it once the app is
      # up. Both must appear in `systemsetup -listtimezones`, which is narrower
      # than tzdb; the script checks that before it changes anything.
      ZONE: Asia/Kolkata
      ZONE_AFTER: Australia/Sydney
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: flutter test (macOS app)
        working-directory: packages/flutter_local_timezone/test_host
        run: sh ../../../.github/scripts/macos_device_test.sh

  # Linux, as a real Flutter app. The only platform with no timezone change
  # notification of any kind, so the plugin infers one from /etc/localtime being
  # replaced and this job is what replaces it.
  linux_app:
    name: linux app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZONE: Asia/Kolkata
      ZONE_AFTER: Australia/Sydney
    steps:
      - uses: actions/checkout@v7

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          # xvfb because a GTK app needs a display even on a runner nobody is
          # looking at, and without one it exits before the suite starts.
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: flutter test (Linux app)
        working-directory: packages/flutter_local_timezone/test_host
        run: sh ../../../.github/scripts/linux_device_test.sh

  # Windows, as a real Flutter app. This is the only job that exercises
  # WM_TIMECHANGE, and it is the one platform whose trigger arrives because the
  # app owns a window rather than because it subscribed to anything.
  windows_app:
    name: windows app
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Two spellings of each zone, because Windows names them its own way and
      # the provider maps between them through CLDR. Checked against the
      # bundled table: `India Standard Time` maps to `Asia/Calcutta`, which
      # canonicalizes to `Asia/Kolkata`, and `AUS Eastern Standard Time` maps
      # to `Australia/Sydney`.
      ZONE: Asia/Kolkata
      WINDOWS_ZONE: India Standard Time
      ZONE_AFTER: Australia/Sydney
      WINDOWS_ZONE_AFTER: AUS Eastern Standard Time
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: flutter test (Windows app)
        shell: pwsh
        working-directory: packages/flutter_local_timezone/test_host
        run: ../../../.github/scripts/windows_device_test.ps1

  # iOS, on a simulator. Narrower than the Android job on purpose: the macOS
  # cells in `test` already exercise `apple.dart` across three zones, so what
  # this adds is the one thing they cannot show, that
  # `DynamicLibrary.process()` resolves Foundation from inside an iOS app.
  # iOS refuses to dlopen a Mach-O that is not embedded in the bundle, so
  # "works on macOS" is not evidence that it works here.
  ios:
    name: ios simulator
    runs-on: macos-15
    timeout-minutes: 45
    # One zone for the whole job. The step below configures the host and the
    # test step asserts the result, and those two only mean anything while they
    # agree, so they read the same variable rather than two literals.
    env:
      ZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # A simulator takes its zone from the host, so moving the host before
      # booting one is the only lever there is. The target has to be spelled
      # through Foundation's own zoneinfo root: it recovers the IANA name by
      # stripping that prefix from the raw /etc/localtime target, and given
      # /usr/share/zoneinfo (itself a symlink) it reads the right tzfile but
      # cannot name it, so it falls back to GMT. That is what broke the macOS
      # cells above, and the same wrong form here desynchronised libc from
      # Foundation inside one process.
      - name: Set the host timezone before anything boots
        run: |
          zone_file="/var/db/timezone/zoneinfo/$ZONE"
          if [ ! -f "$zone_file" ]; then
            echo "::error::no zone file for $ZONE in the macOS tzdata"
            exit 1
          fi
          sudo ln -sfh "$zone_file" /etc/localtime
          date

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r 'first(
            .devices | to_entries[] | select(.key | test("iOS")) | .value[]
            | select(.name | startswith("iPhone")) | .udid
          )')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::no iPhone simulator on this runner image"
            exit 1
          fi

          # `bootstatus -b` boots and then waits. Its exit code is not
          # dependable (a booted device still reports Status=4294967295), so
          # the state is what gets checked.
          xcrun simctl bootstatus "$udid" -b || true
          state=$(xcrun simctl list devices -j \
            | jq -r --arg u "$udid" 'first(.devices[][] | select(.udid == $u) | .state)')
          if [ "$state" != "Booted" ]; then
            echo "::error::simulator $udid did not boot (state=$state)"
            exit 1
          fi
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      # The command, the test path it uses and the zone it asserts all live in
      # the script, next to each other, because each of them only makes sense in
      # terms of the other two. What belongs here is why there is a script at
      # all: `flutter test -d <simulator>` can stop producing output and never
      # return, and until now neither flutter nor this workflow had anything to
      # say about that. The bound below backstops the script's own rather than
      # replacing it, so it leaves room for both attempts the script is allowed
      # to make and only fires if the script itself is what wedged.
      - name: flutter test (iOS simulator)
        working-directory: packages/flutter_local_timezone/test_host
        timeout-minutes: 30
        run: ../../../.github/scripts/ios_simulator_test.sh

  # `environment: sdk: ^3.12.0` in the pubspec is a promise to callers. Without
  # this job the promise is only ever checked against whatever `stable`
  # happens to be.
  min-sdk:
    name: minimum supported SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Take the Flutter packages out of the workspace
        run: |
          rm -rf packages/flutter_local_timezone

          # `test_host` is nested inside what was just deleted, but it is also
          # listed on its own in the root workspace, and pub rejects a member
          # path that is not there: "No workspace packages matching
          # packages/flutter_local_timezone/test_host". So the entry has to go
          # with the directory. grep rather than `sed -i`, whose spelling
          # differs across the GNU, BSD and Git Bash seds this runs on.
          grep -v 'packages/flutter_local_timezone/test_host' pubspec.yaml > pubspec.tmp
          mv pubspec.tmp pubspec.yaml

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.12.0"

      - run: dart pub get

      - name: dart test
        working-directory: packages/local_timezone
        run: dart test
