name: local_timezone_mono_repo

# The workspace root is not a package anyone should depend on.
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/*
  # Listed explicitly because the glob above only reaches one level. Without
  # membership it cannot resolve flutter_local_timezone, which is not on
  # pub.dev.
  - packages/flutter_local_timezone/test_host